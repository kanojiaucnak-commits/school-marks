  <text
    x="24"
    y="26"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#ffffff"
    font-family="Lato, Inter, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="0.5"
  >CC</text>
</svg>