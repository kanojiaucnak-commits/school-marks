# ---------------------------------------------------------------------------
# Deploy the SPA to GitHub Pages
#
# Replaces the Cloudflare Pages deploy. Secrets are supplied as repository
# secrets (Settings → Secrets and variables → Actions), not hard-coded here:
# VITE_CLERK_PUBLISHABLE_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_APP_ORIGIN.
#
# The Supabase `db push` / `functions deploy` job that used to live at the
# bottom of this file is gone. It duplicated `supabase.yml` line for line, and
# the two are not idempotent with respect to each other: re-enabling this
# workflow would have run two `db push` calls against production concurrently,
# with the concurrency group in `supabase.yml` covering only one of them. The
# database and the Edge Functions are deployed by `supabase.yml` alone.
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build -w @school/frontend
        env:
          # Pages serves the project from https://<user>.github.io/<repo>/, so
          # asset URLs must be prefixed with the repository name.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # All three are read at build time by `main.tsx` and inlined into the
          # bundle, so the build *cannot* succeed without them — `main.tsx`
          # collects any that are absent and renders a configuration-error screen
          # instead of the app.
          #
          # They must be listed here explicitly. Vite will fall back to
          # `frontend/.env.local` when present, but that file is gitignored so it
          # does not exist on a clean checkout; without this block every push
          # would publish a working-looking site that only ever shows "not
          # configured", with nothing failing in CI to say so.
          #
          # They are not a leak. Each one is a *publishable* value: Clerk's
          # `pk_...`, the Supabase URL, and the anon key are all shipped to every
          # visitor's browser by design, and real authority comes from RLS plus
          # Clerk session tokens. Marking them as secrets only masks them in logs.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional; `lib/school.ts` falls back to the bundled defaults without it.
          VITE_APP_ORIGIN: ${{ secrets.VITE_APP_ORIGIN }}

      - name: Verify the SPA fallback exists
        # GitHub Pages has no rewrite rules, so a deep link like /app/students
        # is served by dist/404.html. A missing file here means every direct
        # navigation to a nested route breaks in production only.
        run: test -f frontend/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4